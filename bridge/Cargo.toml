[package]
name = "focus-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
thiserror = "2"
regex = "1"
toml = "0.9"
libc = "0.2"

[profile.release]
lto = true
strip = true
opt-level = "s"
