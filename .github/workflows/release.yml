name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: zulu
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Resolve version
        run: |
          echo "FOCUS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "FOCUS_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Decode release keystore
        env:
          FOCUS_KEYSTORE_BASE64: ${{ secrets.FOCUS_KEYSTORE_BASE64 }}
        run: |
          test -n "$FOCUS_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$FOCUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          echo "FOCUS_KEYSTORE_FILE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
      - name: Assemble release apk
        env:
          FOCUS_KEYSTORE_PASSWORD: ${{ secrets.FOCUS_KEYSTORE_PASSWORD }}
          FOCUS_KEY_ALIAS: ${{ secrets.FOCUS_KEY_ALIAS }}
          FOCUS_KEY_PASSWORD: ${{ secrets.FOCUS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain -Pkotlin.daemon.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m"
      - name: Collect apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/focus-${FOCUS_VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: focus-apk
          path: dist/*.apk
          if-no-files-found: error

  bridge:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - name: Install cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
          key: ${{ matrix.target }}
      - name: Build bridge
        working-directory: bridge
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive
        if: matrix.archive == 'tar.gz'
        working-directory: bridge
        run: |
          mkdir -p ../dist
          tar -czf "../dist/focus-bridge-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" focus-bridge
      - name: Package archive
        if: matrix.archive == 'zip'
        shell: pwsh
        working-directory: bridge
        run: |
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/focus-bridge.exe" `
            -DestinationPath "../dist/focus-bridge-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: focus-bridge-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs:
      - android
      - bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Open draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
